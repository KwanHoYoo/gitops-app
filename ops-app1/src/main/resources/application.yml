spring:
  application:
    name: ops-app1
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    model: HTML
    encoding: UTF-8

server:
  port: 8080

app:
  profile: ${PROFILE:default}
  ops-app2-url: ${OPS_APP2_URL:http://ops-app2:8081}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      probes:
        enabled: true
      # livenessState:
      #   enabled: true
      # readinessState:
      #   enabled: true
    prometheus:
      access: read_only
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      # 필요시 SLA 버킷 명시
    slo:
      http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s
    tags:
      application: ${spring.application.name}
      profile: ${app.profile:default}

  logging:
    level:
      com.ops.app1: INFO
      org.springframework.web: INFO
